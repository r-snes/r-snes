name: Release

# Pushing a tag like v1.2.0 builds the release files and publishes them as a GitHub release.
# A tag with a suffix (v1.2.0-rc1) is published as a pre-release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check_version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      # The script names the files after the Cargo.toml version, so it must match the tag.
      - name: Check tag matches Cargo.toml version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" && "$tag_version" != "$version"-* ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: [check_version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [windows, deb, rpm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Build ${{ matrix.target }} release file
        run: bash packaging/build-release.sh ${{ matrix.target }}

      - name: Upload release file
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/v*/r-snes_*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist/
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "R-SNES $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

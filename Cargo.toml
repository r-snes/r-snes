[package]
name = "r-snes"
version = "0.1.0"
edition = "2024"
description = "Cycle-accurate Super Nintendo emulator with sandboxed plugins"
license = "MIT"
authors = ["R-SNES Team <contact.rsnes@gmail.com>"]
homepage = "https://github.com/r-snes"

# Packaging for `cargo deb` and `cargo generate-rpm` (see packaging/build-release.sh).
[package.metadata.deb]
maintainer = "R-SNES Team <contact.rsnes@gmail.com>"
copyright = "2026, R-SNES team"
section = "games"
priority = "optional"
depends = "$auto"
extended-description = "R-SNES is a cycle-accurate SNES emulator written in Rust, with a permission-based plugin system."
assets = [
    [
        "target/release/r-snes",
        "usr/bin/",
        "755",
    ],
    [
        "packaging/r-snes.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "assets/r-snes.png",
        "usr/share/icons/hicolor/512x512/apps/",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/r-snes", dest = "/usr/bin/r-snes", mode = "755" },
    { source = "packaging/r-snes.desktop", dest = "/usr/share/applications/r-snes.desktop", mode = "644" },
    { source = "assets/r-snes.png", dest = "/usr/share/icons/hicolor/512x512/apps/r-snes.png", mode = "644" },
]

[workspace]
members = [
    "apu",
    "bus",
    "common",
    "cpu",
    "cpu/instr_metalang_procmacro",
    "plugins",
    "plugins/permission_derive_macro",
    "plugins/perm_tree_node_derive",
    "ppu",
    "product_order",
    "product_order/product_order_derive",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_docs = "warn"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# common dependencies used across the workspace
[workspace.dependencies]
piccolo = { git = "https://github.com/kyren/piccolo" }
piccolo-util = { git = "https://github.com/kyren/piccolo" }
common = { version = "0.1.0", path = "./common" }
duplicate = "2.0.1"
sdl2 = { version = "0.38.0" }

[dependencies]
common.workspace = true
bus = { version = "0.1.0", path = "./bus" }
cpu = { version = "0.1.0", path = "./cpu" }
ppu = { version = "0.1.0", path = "./ppu" }
apu = { version = "0.1.0", path = "./apu" }
plugins = { version = "0.1.0", path = "./plugins", optional = true }
piccolo = { workspace = true, optional = true }
piccolo-util = { workspace = true, optional = true }
egui-sdl2 = { version = "0.4.0", features = ["canvas-backend"] }
rfd = "0.17.2"
clap = { version = "^4.6.0", features = ["derive"], optional = true }
duplicate.workspace = true

[target.'cfg(windows)'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

[target.'cfg(unix)'.dependencies]
sdl2 = { workspace = true }

[build-dependencies]
winresource = "0.1.31"

[features]
cli = ["dep:clap"]
plugins = ["dep:piccolo", "dep:piccolo-util", "dep:plugins"]
default = ["cli", "plugins"]

[lints]
workspace = true
